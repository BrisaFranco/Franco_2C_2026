<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista 2 - Confirmación EOG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #111111;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: -0.3px;
        }

        .card-success {
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            padding: 40px 20px;
            background-color: #fafafa;
            text-align: center;
        }

        .card-success h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #111111;
        }

        .card-success p {
            font-size: 0.9rem;
            color: #555555;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .btn-back {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            padding: 10px 20px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-back:hover {
            background-color: #222222;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sistema de Control Ocular EOG</h1>

        <div class="card-success">
            <h2>Navegación a Vista 2 Exitosa</h2>
            <p>Se detectó correctamente el pestañeo sobre el botón objetivo y se ejecutó la acción de clic de la interfaz.</p>
            <a href="/" class="btn-back">Volver al inicio</a>
        </div>
    </div>

</body>
</html>
